version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_shop_app
    working_dir: /var/www/html/src/code
    ports:
      - "80:80"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: test_shop_db
    environment:
      MYSQL_DATABASE: test_shop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build:
      context: ./src/design
      dockerfile: Dockerfile
    container_name: test_shop_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/design:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - app

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_shop_reverb
    restart: unless-stopped
    working_dir: /var/www/html/src/code
    command: sh -c "sleep 5 && php artisan config:clear && php artisan reverb:start --host=0.0.0.0 --port=8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_shop_scheduler
    restart: unless-stopped
    working_dir: /var/www/html/src/code
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - app

volumes:
  db_data: