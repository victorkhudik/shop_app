version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_shop_app
    ports:
      - "80:80"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: test_shop_db
    environment:
      MYSQL_DATABASE: test_shop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    build:
      context: ./src/design
      dockerfile: Dockerfile
    container_name: test_shop_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/design:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - app

volumes:
  db_data: